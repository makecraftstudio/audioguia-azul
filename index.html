<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Teatro Español de Azul — Audioguía</title>
<meta name="description" content="Audioguía oficial del Teatro Español de Azul. Recorrido histórico en español e inglés.">

<!-- Compartir por WhatsApp / redes. Si cambia el dominio, actualizar estas dos URLs. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Teatro Español de Azul — Audioguía">
<meta property="og:description" content="Audioguía oficial del Teatro Español de Azul.">
<meta property="og:url" content="https://teatroespanoldeazul.com/audioguia/">
<meta property="og:image" content="https://teatroespanoldeazul.com/audioguia/images/splash.webp">

<link rel="icon" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<noscript>
  <div class="fatal">
    <p>Esta audioguía necesita JavaScript activado.</p>
  </div>
</noscript>

<!-- error de carga de contenido -->
<div id="fatal-error" class="fatal" hidden>
  <p id="fatal-error-msg"></p>
</div>

<!-- ══════════ SPLASH ══════════ -->
<div id="splash">
  <div id="splash-dismiss"></div>
  <div class="splash-bg" id="splash-bg"></div>
  <div class="splash-gradient"></div>
  <div class="splash-content">
    <div class="splash-eyebrow" id="splash-eyebrow"></div>
    <div class="splash-title" id="splash-title"></div>
    <div class="splash-sub" id="splash-sub"></div>
    <div class="splash-langs" id="splash-langs"></div>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="main">
  <div id="header">
    <button class="icon-btn" id="btn-menu" aria-label="Abrir menú">
      <svg width="18" height="13" viewBox="0 0 18 13" fill="none" aria-hidden="true">
        <rect width="18" height="1.5" rx="0.75" fill="currentColor"/>
        <rect y="5.75" width="12" height="1.5" rx="0.75" fill="currentColor"/>
        <rect y="11.5" width="18" height="1.5" rx="0.75" fill="currentColor"/>
      </svg>
    </button>
    <div class="header-title" id="header-title"></div>
    <button class="lang-pill" id="btn-lang" aria-label="Cambiar idioma">ES</button>
  </div>

  <div class="slider-wrap" id="slider-wrap"></div>

  <div class="item-info">
    <div class="item-section-label" id="item-section-label"></div>
    <div class="item-title" id="item-title"></div>
    <div class="item-progress" id="item-progress"></div>
  </div>

  <div class="player">
    <div class="player-row">
      <button class="play-btn" id="play-btn" aria-label="Reproducir">
        <svg width="16" height="18" viewBox="0 0 16 18" fill="currentColor" aria-hidden="true"><path d="M0 0L16 9L0 18V0Z"/></svg>
      </button>
      <div class="player-meta">
        <div class="player-time" id="player-time">0:00 / 0:00</div>
        <div class="progress-track" id="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
          <div class="progress-thumb" id="progress-thumb"></div>
        </div>
      </div>
    </div>
    <button class="read-btn" id="read-btn">
      <svg width="14" height="16" viewBox="0 0 14 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <rect x="1" y="1" width="12" height="14" rx="1.5"/>
        <line x1="4" y1="5" x2="10" y2="5"/>
        <line x1="4" y1="8" x2="10" y2="8"/>
        <line x1="4" y1="11" x2="7" y2="11"/>
      </svg>
      <span id="read-label"></span>
    </button>
  </div>

  <div class="item-nav">
    <button class="item-nav-btn prev" id="btn-prev">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 2L4 7l5 5"/></svg>
      <span class="item-nav-label" id="prev-label"></span>
    </button>
    <button class="item-nav-btn next" id="btn-next">
      <span class="item-nav-label" id="next-label"></span>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 2l5 5-5 5"/></svg>
    </button>
  </div>

  <div class="section-nav" id="section-nav"></div>
</div>

<!-- ══════════ DRAWER ══════════ -->
<div id="drawer-overlay"></div>
<div id="drawer">
  <div class="drawer-header">
    <div class="drawer-header-title" id="drawer-title"></div>
    <button class="icon-btn" id="btn-close-drawer" aria-label="Cerrar menú">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/>
      </svg>
    </button>
  </div>
  <div id="drawer-body"></div>
</div>

<!-- ══════════ POPUP INTRO DE CIRCUITO ══════════ -->
<div id="section-popup-overlay">
  <div id="section-popup">
    <button class="popup-close" id="section-popup-close" aria-label="Cerrar">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/>
      </svg>
    </button>
    <div class="popup-handle"></div>
    <div class="popup-eyebrow" id="section-popup-eyebrow"></div>
    <div class="popup-title" id="section-popup-title"></div>
    <div class="popup-body" id="section-popup-body"></div>
    <button id="section-popup-cta">
      <span id="section-popup-cta-label"></span>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 7h10M8 3l4 4-4 4"/></svg>
    </button>
  </div>
</div>

<!-- ══════════ VISOR A PANTALLA COMPLETA ══════════ -->
<div id="lightbox" hidden>
  <div id="lb-top">
    <div id="lb-counter"></div>
    <button id="lb-close" aria-label="Cerrar">
      <svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/>
      </svg>
    </button>
  </div>

  <div id="lb-stage">
    <img id="lb-img" alt="">
    <button class="lb-nav prev" id="lb-prev" aria-label="Imagen anterior">‹</button>
    <button class="lb-nav next" id="lb-next" aria-label="Imagen siguiente">›</button>
  </div>

  <div id="lb-bottom">
    <div id="lb-caption"></div>
    <div id="lb-dots"></div>
  </div>
</div>

<!-- ══════════ POPUP TEXTO COMPLETO ══════════ -->
<div id="popup-overlay">
  <div id="popup">
    <button class="popup-close" id="popup-close" aria-label="Cerrar">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/>
      </svg>
    </button>
    <div class="popup-handle"></div>
    <div class="popup-eyebrow" id="popup-eyebrow"></div>
    <div class="popup-title" id="popup-title"></div>
    <div class="popup-body" id="popup-body"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
